<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Loom</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }
        
        body {
            background-color: #06121F;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .app-container {
            display: flex;
            min-height: 100vh;
        }
        
        /* Sidebar Navigation */
        /* ================= Sidebar ================= */
.sidebarmain {
    width: 60px;
    background-color: #06121f;
    padding: 20px 0;
    min-height: 100vh;
    transition: width 0.4s ease;
    overflow: hidden;
    border-right: 1px solid rgba(255,255,255,0.1);
}

.sidebarmain:hover {
    width: 200px;
}

.sidebar-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    color: white;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.3s ease;
}

.sidebar-item:hover {
    background: rgba(255,255,255,0.08);
}

.sidebar-icon {
    width: 24px;
    font-size: 20px;
    color: #9CA3AF;
}

.sidebar-item:hover .sidebar-icon {
    color: #fff;
}

.sidebar-item span {
    opacity: 0;
    transform: translateX(-10px);
    transition: 0.3s;
    white-space: nowrap;
}

.sidebarmain:hover .sidebar-item span {
    opacity: 1;
    transform: translateX(0);
}

/* ================= Search ================= */
.search-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: none;
}

.search-panel {
    position: fixed;
    width: 380px;
    max-width: 90%;
    background: #071826;
    border-radius: 12px;
    padding: 12px;
    box-shadow: 0 12px 30px rgba(0,0,0,.6);
}

.search-panel.hidden {
    opacity: 0;
    transform: translateY(-8px) scale(.98);
    pointer-events: none;
}

.search-input {
    width: 100%;
    padding: 12px;
    border-radius: 20px;
    background: rgba(255,255,255,.03);
    border: none;
    color: #fff;
    outline: none;
}

.search-results {
    margin-top: 10px;
    max-height: 50vh;
    overflow-y: auto;
}

.search-item {
    display: flex;
    gap: 10px;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
}

.search-item:hover {
    background: rgba(255,255,255,.05);
}

.search-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #0A4073;
}

.search-title {
    font-size: 14px;
    font-weight: 600;
}

.search-sub {
    font-size: 12px;
    color: #9CA3AF;
}

/* ================= Notifications ================= */
.notifications-overlay {
    position: fixed;
    inset: 0;
    z-index: 9998;
    display: none;
}

.notifications-panel {
    position: fixed;
    width: 320px;
    background: #071826;
    border-radius: 12px;
    padding: 12px;
    color: #fff;
    box-shadow: 0 12px 30px rgba(0,0,0,.6);
}

.notifications-panel.hidden {
    opacity: 0;
    transform: translateY(-8px);
    pointer-events: none;
}

.notification-item {
    display: flex;
    gap: 10px;
    padding: 10px;
    border-radius: 8px;
}

.notification-item:hover {
    background: rgba(255,255,255,.03);
}

.notification-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
}

.notification-title {
    font-size: 14px;
    font-weight: 600;
}

.notification-text {
    font-size: 13px;
    color: #9CA3AF;
}

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 20px 40px;
            overflow-y: auto;
        }
        
        /* Header */
        .page-header {
            margin-bottom: 40px;
        }
        
        .page-title {
            font-size: 45px;
            font-weight: 600;
            color: white;
        }
        
        /* Profile Edit Container */
        .profile-edit-container {
            max-width: 1100px;
            margin: 0 auto;
        }
        
        /* Profile Image Section */
        .profile-image-section {
            text-align: center;
            margin-bottom: 50px;
            position: relative;
        }
        
        .profile-image-container {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }
        
        .profile-image {
            width: 286px;
            height: 286px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #2469AC;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            cursor: pointer;
        }
        
        .profile-image-container:hover .image-overlay {
            opacity: 1;
        }
        
        .change-photo-btn {
            background-color: #2469AC;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .camera-icon {
            background-color: #1C1C1C;
            width: 33.75px;
            height: 33.75px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            bottom: 20px;
            right: 20px;
            cursor: pointer;
            z-index: 2;
        }
        
        .camera-icon i {
            color: white;
            font-size: 18px;
        }
        
        /* Form Section */
        .form-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .form-group {
            margin-bottom: 30px;
        }
        
        .form-label {
            display: block;
            font-size: 18px;
            font-weight: 600;
            color: white;
            margin-bottom: 10px;
            background-color: #06121F;
            padding: 0 10px;
            width: fit-content;
            position: relative;
            z-index: 1;
        }
        
        .form-input {
            width: 100%;
            height: 66px;
            padding: 0 20px;
            font-size: 18px;
            color: white;
            background-color: transparent;
            border: 2px solid #2469AC;
            border-radius: 14px;
            outline: none;
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            border-color: #FF5C21;
            box-shadow: 0 0 0 2px rgba(255, 92, 33, 0.2);
        }
        
        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .full-width {
            grid-column: 1 / span 2;
        }
        
        .description-input {
            height: 192px;
            padding: 20px;
            resize: vertical;
            font-family: 'Roboto', sans-serif;
            line-height: 1.5;
        }
        
        /* Skills Input */
        .skills-input-container {
            position: relative;
        }
        
        .skills-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            min-height: 40px;
        }
        
        .skill-tag {
            background-color: #2469AC;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .remove-skill {
            cursor: pointer;
            font-size: 12px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        
        .remove-skill:hover {
            opacity: 1;
        }
        
        .skills-input {
            width: 100%;
        }
        
        .skills-hint {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 8px;
        }
        
        /* Action Buttons */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 60px;
        }
        
        .cancel-btn {
            width: 180px;
            height: 55px;
            background-color: #2469AC;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 28px;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .cancel-btn:hover {
            background-color: #1a5085;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .save-btn {
            width: 180px;
            height: 55px;
            background-color: transparent;
            color: white;
            border: 2px solid #2469AC;
            border-radius: 5px;
            font-size: 28px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .save-btn:hover {
            background-color: rgba(36, 105, 172, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        /* Modal for Image Upload */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background-color: #0B1F36;
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
        }
        
        .modal-title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 20px;
            color: white;
            text-align: center;
        }
        
        .modal-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .modal-option {
            background-color: #1C3652;
            border: none;
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: background-color 0.3s;
        }
        
        .modal-option:hover {
            background-color: #2469AC;
        }
        
        .modal-option i {
            font-size: 22px;
        }
        
        .modal-cancel {
            background-color: transparent;
            border: 1px solid #FF5C21;
            color: #FF5C21;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }
        
        .modal-cancel:hover {
            background-color: rgba(255, 92, 33, 0.1);
        }
        
        /* File Input Hidden */
        #imageUpload {
            display: none;
        }
        
        /* Responsive Design */
        @media (max-width: 1024px) {
            .form-section {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .full-width {
                grid-column: 1;
            }
            
            .profile-image {
                width: 220px;
                height: 220px;
            }
        }
        
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                height: auto;
                padding: 10px 0;
                flex-direction: row;
                justify-content: center;
            }
            
            .nav-items {
                flex-direction: row;
                gap: 20px;
                margin-top: 0;
                flex-wrap: wrap;
            }
            
            .nav-item {
                width: auto;
                padding: 5px 10px;
            }
            
            .nav-icon {
                width: 40px;
                height: 40px;
                margin-bottom: 5px;
            }
            
            .main-content {
                padding: 20px;
            }
            
            .page-title {
                font-size: 36px;
                text-align: center;
            }
            
            .action-buttons {
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }
            
            .cancel-btn, .save-btn {
                width: 100%;
                max-width: 300px;
            }
        }
        
        @media (max-width: 576px) {
            .profile-image {
                width: 180px;
                height: 180px;
            }
            
            .form-input {
                height: 56px;
                font-size: 16px;
            }
            
            .description-input {
                height: 150px;
            }
            
            .cancel-btn, .save-btn {
                height: 50px;
                font-size: 24px;
            }
        }
        
        /* Loading Animation */
        .loading {
            display: none;
        }
        
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Success Message */
        .success-message {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #34A853;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 100;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.5s ease;
        }
        
        .success-message.show {
            transform: translateY(0);
            opacity: 1;
        }
        
        .success-message i {
            font-size: 22px;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #0B1F36;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #1C3652;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #2469AC;
        }
    </style>
</head>
<body>

<div class="sidebarmain">

        <!-- Main Content -->

            <!-- Profile Edit Container -->

                <div class="profile-image-section">

                        <div class="image-overlay">

                <!-- Profile Form -->
                <div class="form-section">

                    <div class="form-group">

                        <input type="text" class="form-input" id="nameInput" placeholder="Enter your full name" value="John Doe">
                    </div>
                    
                    <!-- Username -->
                    <div class="form-group">
                        <label class="form-label">User name</label>
                        <input type="text" class="form-input" id="usernameInput" placeholder="Enter your username" value="@johndoe">
                    </div>
                    
                    <!-- Email -->
                    <div class="form-group">
                        <label class="form-label">E-mail</label>
                        <input type="email" class="form-input" id="emailInput" placeholder="Enter your email" value="john.doe@example.com">
                    </div>
                    
                    <!-- Skills -->
                    <div class="form-group">
                        <label class="form-label">Skills</label>
                        <div class="skills-input-container">
                            <input type="text" class="form-input skills-input" id="skillsInput" placeholder="Type a skill and press Enter">
                            <div class="skills-tags" id="skillsTags">
                                <!-- Skills will be added here dynamically -->
                            </div>
                            <div class="skills-hint">Press Enter or comma to add a skill</div>
                        </div>
                    </div>
                    
                    <!-- Description -->
                    <div class="form-group full-width">
                        <label class="form-label">Description</label>
                        <textarea class="form-input description-input" id="descriptionInput" placeholder="Tell us about yourself">Passionate full-stack developer with 5+ years of experience building web applications. Specialized in React, Node.js, and cloud technologies. Always eager to learn new technologies and collaborate on exciting projects.</textarea>
                    </div>
                </div>
                
                <!-- Action Buttons -->
                <div class="action-buttons">
                    <button class="cancel-btn" id="cancelBtn">
                        Cancel
                    </button>
                    <button class="save-btn" id="saveBtn">
                        <span>Save</span>
                        <div class="loading" id="saveLoading">
                            <div class="spinner"></div>
                        </div>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Image Upload Modal -->
        <div class="modal" id="imageModal">
            <div class="modal-content">
                <h2 class="modal-title">Change Profile Photo</h2>
                
                <div class="modal-options">
                    <button class="modal-option" onclick="triggerFileInput()">
                        <i class="fas fa-upload"></i> Upload Photo
                    </button>
                    <button class="modal-option" onclick="takePhoto()">
                        <i class="fas fa-camera"></i> Take Photo
                    </button>
                    <button class="modal-option" onclick="removePhoto()">
                        <i class="fas fa-trash"></i> Remove Current Photo
                    </button>
                </div>
                
                <button class="modal-cancel" onclick="closeImageModal()">
                    Cancel
                </button>
                
                <input type="file" id="imageUpload" accept="image/*">
            </div>
        </div>
        
        <!-- Success Message -->
        <div class="success-message" id="successMessage">
            <i class="fas fa-check-circle"></i>
            <span>Profile updated successfully!</span>
        </div>
    </div>

    <script>
        // DOM Elements
        const profileImage = document.getElementById('profileImage');
        const nameInput = document.getElementById('nameInput');
        const usernameInput = document.getElementById('usernameInput');
        const emailInput = document.getElementById('emailInput');
        const skillsInput = document.getElementById('skillsInput');
        const descriptionInput = document.getElementById('descriptionInput');
        const skillsTags = document.getElementById('skillsTags');
        const saveBtn = document.getElementById('saveBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const saveLoading = document.getElementById('saveLoading');
        const imageModal = document.getElementById('imageModal');
        const imageUpload = document.getElementById('imageUpload');
        const successMessage = document.getElementById('successMessage');
        
        // Sample skills (initial data)
        let skills = ['JavaScript', 'React', 'Node.js', 'Python', 'UI/UX Design'];
        
        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            // Render initial skills
            renderSkills();
            
            // Set up skills input
            skillsInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ',') {
                    e.preventDefault();
                    addSkill(this.value.trim());
                    this.value = '';
                }
            });
            
            // Set up save button
            saveBtn.addEventListener('click', saveProfile);
            
            // Set up cancel button
            cancelBtn.addEventListener('click', cancelEdit);
            
            // Set up image upload
            imageUpload.addEventListener('change', handleImageUpload);
        });
        
        // Render skills as tags
        function renderSkills() {
            skillsTags.innerHTML = '';
            
            skills.forEach((skill, index) => {
                const tag = document.createElement('div');
                tag.className = 'skill-tag';
                tag.innerHTML = `
                    ${skill}
                    <span class="remove-skill" onclick="removeSkill(${index})">
                        <i class="fas fa-times"></i>
                    </span>
                `;
                skillsTags.appendChild(tag);
            });
        }
        
        // Add a new skill
        function addSkill(skill) {
            if (skill && !skills.includes(skill)) {
                skills.push(skill);
                renderSkills();
            }
        }
        
        // Remove a skill
        function removeSkill(index) {
            skills.splice(index, 1);
            renderSkills();
        }
        
        // Open image modal
        function openImageModal() {
            imageModal.style.display = 'flex';
        }
        
        // Close image modal
        function closeImageModal() {
            imageModal.style.display = 'none';
        }
        
        // Trigger file input
        function triggerFileInput() {
            imageUpload.click();
            closeImageModal();
        }
        
        // Handle image upload
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                if (file.size > 5 * 1024 * 1024) {
                    alert('File size should be less than 5MB');
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    profileImage.src = e.target.result;
                    showSuccessMessage('Profile photo updated!');
                };
                reader.readAsDataURL(file);
            }
        }
        
        // Take photo (simulated)
        function takePhoto() {
            alert('Camera functionality would be implemented here. For this demo, please use "Upload Photo".');
            closeImageModal();
        }
        
        // Remove current photo
        function removePhoto() {
            profileImage.src = 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=500&q=80';
            showSuccessMessage('Profile photo removed!');
            closeImageModal();
        }
        
        // Save profile
        function saveProfile() {
            // Validate form
            if (!nameInput.value.trim()) {
                alert('Please enter your name');
                nameInput.focus();
                return;
            }
            
            if (!usernameInput.value.trim()) {
                alert('Please enter a username');
                usernameInput.focus();
                return;
            }
            
            if (!emailInput.value.trim()) {
                alert('Please enter your email');
                emailInput.focus();
                return;
            }
            
            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(emailInput.value)) {
                alert('Please enter a valid email address');
                emailInput.focus();
                return;
            }
            
            // Show loading
            saveBtn.querySelector('span').style.display = 'none';
            saveLoading.style.display = 'block';
            saveBtn.disabled = true;
            
            // Simulate API call
            setTimeout(() => {
                // Hide loading
                saveBtn.querySelector('span').style.display = 'block';
                saveLoading.style.display = 'none';
                saveBtn.disabled = false;
                
                // Show success message
                showSuccessMessage('Profile updated successfully!');
                
                // In a real app, you would send data to the server
                const profileData = {
                    name: nameInput.value,
                    username: usernameInput.value,
                    email: emailInput.value,
                    skills: skills,
                    description: descriptionInput.value,
                    image: profileImage.src
                };
                
                console.log('Profile saved:', profileData);
                alert('Profile saved successfully!');
            }, 1500);
        }
        
        // Cancel edit
        function cancelEdit() {
            if (confirm('Are you sure you want to cancel? Any unsaved changes will be lost.')) {
                // Reset form to original values (in a real app, you would fetch from server)
                nameInput.value = 'John Doe';
                usernameInput.value = '@johndoe';
                emailInput.value = 'john.doe@example.com';
                skills = ['JavaScript', 'React', 'Node.js', 'Python', 'UI/UX Design'];
                renderSkills();
                descriptionInput.value = 'Passionate full-stack developer with 5+ years of experience building web applications. Specialized in React, Node.js, and cloud technologies. Always eager to learn new technologies and collaborate on exciting projects.';
                profileImage.src = 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=500&q=80';
                
                alert('Changes discarded.');
            }
        }
        
        // Show success message
        function showSuccessMessage(message) {
            successMessage.querySelector('span').textContent = message;
            successMessage.classList.add('show');
            
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 3000);
        }
        
        // Navigation function
        function navigateTo(page) {
            // In a real app, you would navigate to different pages
            console.log(`Navigating to: ${page}`);
            alert(`In a real application, this would navigate to the ${page} page.`);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === imageModal) {
                closeImageModal();
            }
        });

        /* ================= Search ================= */
function initSearch() {
    const overlay = document.createElement('div');
    overlay.className = 'search-overlay';

    const panel = document.createElement('div');
    panel.className = 'search-panel hidden';

    const input = document.createElement('input');
    input.className = 'search-input';
    input.placeholder = 'Search...';

    const results = document.createElement('div');
    results.className = 'search-results';

    panel.append(input, results);
    overlay.append(panel);
    document.body.append(overlay);

    const dataset = [];
    document.querySelectorAll('.friend-name').forEach(el => {
        dataset.push({ title: el.textContent, sub: 'User' });
    });

    function render(list) {
        results.innerHTML = '';
        list.forEach(i => {
            results.innerHTML += `
                <div class="search-item">
                    <div class="search-avatar"></div>
                    <div>
                        <div class="search-title">${i.title}</div>
                        <div class="search-sub">${i.sub}</div>
                    </div>
                </div>`;
        });
    }

    input.addEventListener('input', e => {
        const q = e.target.value.toLowerCase();
        render(dataset.filter(d => d.title.toLowerCase().includes(q)));
    });

    document.getElementById('openSearch').onclick = e => {
        e.preventDefault();
        const r = e.target.closest('.sidebar-item').getBoundingClientRect();
        panel.style.left = r.right + 12 + 'px';
        panel.style.top = r.top + 'px';
        overlay.style.display = 'block';
        panel.classList.remove('hidden');
        input.focus();
    };

    overlay.onclick = e => {
        if (e.target === overlay) overlay.style.display = 'none';
    };
}

initSearch();

function initNotifications() {
    const overlay = document.createElement('div');
    overlay.className = 'notifications-overlay';

    const panel = document.createElement('div');
    panel.className = 'notifications-panel hidden';

    panel.innerHTML = `
        <div class="notification-item">
            <img class="notification-avatar">
            <div>
                <div class="notification-title">User</div>
                <div class="notification-text">Sent you a request</div>
            </div>
        </div>
    `;

    overlay.append(panel);
    document.body.append(overlay);

    document.querySelectorAll('.sidebar-item')
        .find(a => a.textContent.trim() === 'Notifications')
        ?.addEventListener('click', e => {
            e.preventDefault();
            const r = e.target.closest('.sidebar-item').getBoundingClientRect();
            panel.style.left = r.right + 12 + 'px';
            panel.style.top = r.top + 'px';
            overlay.style.display = 'block';
            panel.classList.remove('hidden');
        });

    overlay.onclick = e => {
        if (e.target === overlay) overlay.style.display = 'none';
    };
}

initNotifications();
